- date: 2026-03-24
  text: "We are delighted to share exciting news: our invited Spotlight manuscript, “AHCY–adenosine complex links m⁶A and cancer lipid metabolism” has been published in *Trends in Biochemical Sciences*, This first publication from our lab marks a wonderful milestone and a great start to the Chinese New Year. Congratulations to Hang! 🎉"

- date: 2026-03-06
  text: "We are pleased to welcome Huanmin Jiao to our lab as a Research Assistant."

- date: 2026-02-15
  text: "Our research on the functional implications of EZH and A-to-I RNA editing in prostate cancer has been accepted for publication in Nature Communications."

- date: 2026-01-15
  text: "We submitted our first review paper, 'Applications of Single-Cell Long-Read Sequencing Technologies in Cancer,' with undergraduate student Zijie Ding as first author."

- date: 2025-10-01
  text: "We welcomed new undergraduate students (incoming master's students) to the lab."

- date: 2025-08-01
  text: "Dr. Hang Qin joined the lab as an Assistant Professor."

- date: 2025-06-01
  text: "Our research on protocols for mapping Nm modifications using NanoNm has been accepted for publication in STAR Protocols."

- date: 2025-03-20
  text: "Dr. Yanqiang Li joined the First Affiliated Hospital of Xi’an Jiaotong University as Principal Investigator, and the Epigenetics & Computational RNA Biology Lab was officially established."
